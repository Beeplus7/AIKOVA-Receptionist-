<style id="aikova-ui-polish">
  html, body, #root {
    background: #E6EBF4 !important;
    overflow-x: clip !important;
  }
  .min-h-screen {
    background: #E6EBF4 !important;
  }
  header, nav, aside {
    background-color: rgba(255,255,255,0.94) !important;
  }
  .bg-white {
    background-color: #FFFFFF !important;
  }
  .rounded-2xl,
  .rounded-3xl {
    overflow: visible !important;
    max-width: 100%;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 10px 28px rgba(15,23,42,0.07) !important;
  }
  .overflow-y-auto,
  .overflow-auto,
  .custom-scroll {
    overflow: auto !important;
  }
  .overflow-x-auto {
    overflow-x: auto !important;
    overflow-y: hidden !important;
    max-width: 100%;
  }
  /* CTAs: squircle instead of pill */
  button.rounded-full,
  a.rounded-full,
  button[class*="rounded-full"],
  a[class*="rounded-full"] {
    border-radius: 12px !important;
  }
  input.rounded-full,
  select.rounded-full,
  textarea.rounded-full {
    border-radius: 12px !important;
  }
  /* Keep dots + avatar circles */
  .rounded-full.h-1\.5,
  .rounded-full.w-1\.5,
  .rounded-full.h-2,
  .rounded-full.w-2,
  .h-1\.5.w-1\.5,
  .h-2.w-2,
  .w-7.h-7.rounded-full,
  .w-8.h-8.rounded-full,
  .w-9.h-9.rounded-full,
  .w-10.h-10.rounded-full,
  .h-7.w-7.rounded-full,
  .h-8.w-8.rounded-full,
  .h-9.w-9.rounded-full,
  .h-10.w-10.rounded-full {
    border-radius: 9999px !important;
  }
  span.rounded-full {
    border-radius: 10px !important;
  }
  span.rounded-full.h-1\.5,
  span.rounded-full.w-1\.5,
  span.rounded-full.h-2,
  span.rounded-full.w-2 {
    border-radius: 9999px !important;
  }
  .bg-\[\#F8FAFC\] {
    background-color: #F1F5F9 !important;
  }
  p, h1, h2, h3, h4, li, label {
    overflow-wrap: anywhere;
  }
  .truncate {
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
    overflow-wrap: normal !important;
  }
  .grid > *,
  .flex > * {
    min-width: 0;
  }
</style>
