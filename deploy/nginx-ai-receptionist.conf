upstream aikova_receptionist_api {
    server 127.0.0.1:3016;
    keepalive 16;
}

# Meta AI / LinkedIn / Facebook / social / search bots — static HTML (no JS SPA)
map $http_user_agent $aikova_link_bot {
    default 0;
    ~*(facebookexternalhit|Facebot|FacebookBot) 1;
    ~*(meta-externalagent|Meta-ExternalAgent|Meta-ExternalFetcher|meta-externalfetcher) 1;
    ~*(meta-webindexer|MetaInspector|Instagram|ThreadsBot|Threads) 1;
    ~*(Twitterbot|LinkedInBot|LinkedInBot\/|Slackbot|WhatsApp|Discordbot|TelegramBot) 1;
    ~*(Googlebot|bingbot|Applebot|DuckDuckBot|Slurp) 1;
}

server {
    server_name ai-receptionist.aikova.co.uk;
    client_max_body_size 25m;
    root /var/www/ai-receptionist/web;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /health {
        proxy_pass http://aikova_receptionist_api/health;
        proxy_http_version 1.1;
    }

    location = /actions {
        proxy_pass http://aikova_receptionist_api/actions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
    }

    location /api/ {
        proxy_pass http://aikova_receptionist_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_set_header stripe-signature $http_stripe_signature;
    }

    # ---- Bot-only static snapshots ----
    location = / {
        error_page 418 = @home_bot;
        if ($aikova_link_bot) { return 418; }
        try_files /index.html =404;
    }
    location @home_bot { rewrite ^ /home.html break; }

    location = /eu {
        error_page 418 = @home_bot;
        if ($aikova_link_bot) { return 418; }
        try_files /index.html =404;
    }

    location = /try {
        error_page 418 = @try_bot;
        if ($aikova_link_bot) { return 418; }
        try_files /index.html =404;
    }
    location @try_bot { rewrite ^ /try.html break; }

    location = /readiness {
        error_page 418 = @readiness_bot;
        if ($aikova_link_bot) { return 418; }
        try_files /index.html =404;
    }
    location @readiness_bot { rewrite ^ /readiness.html break; }

    location = /trials {
        error_page 418 = @trials_bot;
        if ($aikova_link_bot) { return 418; }
        try_files /index.html =404;
    }
    location @trials_bot { rewrite ^ /trials.html break; }

    location = /trials/estate-agents {
        error_page 418 = @trial_estate;
        if ($aikova_link_bot) { return 418; }
        try_files /index.html =404;
    }
    location @trial_estate { rewrite ^ /trials-estate-agents.html break; }

    location = /trials/trades {
        error_page 418 = @trial_trades;
        if ($aikova_link_bot) { return 418; }
        try_files /index.html =404;
    }
    location @trial_trades { rewrite ^ /trials-trades.html break; }

    location = /trials/clinics {
        error_page 418 = @trial_clinics;
        if ($aikova_link_bot) { return 418; }
        try_files /index.html =404;
    }
    location @trial_clinics { rewrite ^ /trials-clinics.html break; }

    location = /trials/restaurants {
        error_page 418 = @trial_restaurants;
        if ($aikova_link_bot) { return 418; }
        try_files /index.html =404;
    }
    location @trial_restaurants { rewrite ^ /trials-restaurants.html break; }

    location = /trials/salons {
        error_page 418 = @trial_salons;
        if ($aikova_link_bot) { return 418; }
        try_files /index.html =404;
    }
    location @trial_salons { rewrite ^ /trials-salons.html break; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ai-receptionist.aikova.co.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai-receptionist.aikova.co.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = ai-receptionist.aikova.co.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name ai-receptionist.aikova.co.uk;
    return 404; # managed by Certbot
}
