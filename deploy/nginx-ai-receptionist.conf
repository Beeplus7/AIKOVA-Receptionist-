upstream aikova_receptionist_api {
    server 127.0.0.1:3016;
    keepalive 16;
}
server {
    server_name ai-receptionist.aikova.co.uk;
    client_max_body_size 25m;
    root /var/www/ai-receptionist/web;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /health {
        proxy_pass http://aikova_receptionist_api/health;
        proxy_http_version 1.1;
    }

    location = /actions {
        proxy_pass http://aikova_receptionist_api/actions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
    }

    location /api/ {
        proxy_pass http://aikova_receptionist_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ai-receptionist.aikova.co.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai-receptionist.aikova.co.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = ai-receptionist.aikova.co.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name ai-receptionist.aikova.co.uk;
    return 404; # managed by Certbot


}